name: 从源码编译并发布中文安装版

# 完全由本仓库源码编译，不下载上游任何安装包。
# 产物：NSIS 中文 exe 安装程序、单文件 exe、中文 MSI、便携 zip、SHA256SUMS.txt、latest.json。
# 程序内置更新器（crates/ui-egui/src/update.rs）已固定指向 wodeya163/solidcraft 的 releases/latest，
# 因此从这里编译出的二进制，检查更新/下载/校验全走自己的 GitHub。
on:
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本（必须与根 Cargo.toml 的 version 一致，如 0.49.0）'
        required: true
        default: '0.49.0'
      publish:
        description: '创建/更新 GitHub Release（releases/latest）'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: build-from-source-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-x64:
    name: Windows x64 中文版（源码编译）
    runs-on: windows-latest
    timeout-minutes: 360
    env:
      VERSION: ${{ inputs.version || '0.49.0' }}
      SOLIDCRAFT_VERSION: ${{ inputs.version || '0.49.0' }}
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
    steps:
      - name: 检出本仓库源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 安装 Rust 1.99.1（MSVC x64）
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: x86_64-pc-windows-msvc

      - name: 缓存 cargo 构建结果
        uses: Swatinem/rust-cache@v2
        with:
          key: zh-cn-from-source-windows-x64

      - name: 安装 WiX v5（中文 MSI）
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2
          wix --version

      - name: 安装 NSIS（中文 exe 安装向导）
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $pf86 = [Environment]::GetEnvironmentVariable('ProgramFiles(x86)')
          if (-not $pf86) { $pf86 = $env:ProgramFiles }
          $nsisDir = Join-Path $pf86 'NSIS'
          if (-not (Test-Path (Join-Path $nsisDir 'makensis.exe'))) { throw "找不到 makensis：$nsisDir" }
          Add-Content -Path $env:GITHUB_PATH -Value $nsisDir
          & (Join-Path $nsisDir 'makensis.exe') /VERSION

      - name: 核对源码版本与发布版本一致
        shell: pwsh
        run: |
          $line = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1)
          $src = $line.Matches[0].Groups[1].Value
          Write-Host "Cargo.toml version = $src / 发布版本 = $env:VERSION"
          if ($src -ne $env:VERSION) { throw "版本不一致：请把 workflow 的 version 改成 $src，或同步修改 Cargo.toml" }

      - name: 编译并打包（exe 安装程序 / MSI / 便携版）
        shell: pwsh
        run: |
          ./zh-cn/packaging/windows/build-from-source.ps1 -Version $env:VERSION -Dist 'dist/release'
          Write-Host '=== SHA256SUMS.txt ==='
          Get-Content dist/release/SHA256SUMS.txt

      - name: 上传构建产物（仅当不发布 Release 时）
        if: ${{ inputs.publish != true }}
        uses: actions/upload-artifact@v4
        with:
          name: solidcraft-zh-cn-windows-x64-${{ env.VERSION }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 5

      - name: 发布到 releases/latest
        if: ${{ inputs.publish == true }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:VERSION"
          $files = @(
            "dist/release/SolidCraft-$env:VERSION-zh-cn-setup.exe",
            "dist/release/SolidCraft-$env:VERSION-windows-x64.exe",
            'dist/release/solidcraft-windows-x64.msi',
            'dist/release/solidcraft-windows-x64-portable.zip',
            'dist/release/SHA256SUMS.txt',
            'dist/release/latest.json'
          )
          foreach ($f in $files) { if (-not (Test-Path $f)) { throw "缺少待发布文件：$f" } }
          $notes = @"
          SolidCraft 中文版 v$env:VERSION —— 由本仓库源码完整编译（未使用上游二进制）。

          - 界面默认简体中文；程序内「检查更新」固定指向 wodeya163/solidcraft/releases/latest
          - 下载资产后用本 Release 的 SHA256SUMS.txt 校验，再原地更新，不再连接上游
          - 推荐下载 SolidCraft-$env:VERSION-zh-cn-setup.exe：免管理员、中文安装向导、开始菜单与卸载项
          - 单文件 exe 可直接双击运行；MSI 适合 IT 批量部署；便携 zip 用于覆盖升级

          详见 README.zh-CN.md 与 zh-cn/docs/从源码编译到自动更新.zh-CN.md。
          "@
          $existing = gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0 -and $existing) {
            gh release upload $tag $files --clobber
          } else {
            gh release create $tag $files --title "SolidCraft 中文版 v$env:VERSION" --notes $notes --latest
          }
          if ($LASTEXITCODE -ne 0) { throw "发布 Release 失败，退出码 $LASTEXITCODE" }
          gh release view $tag
